<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta http-equiv="refresh" content="0;url={{ page.redirect_to | relative_url }}">
</head>
<body>
  <p>This page has moved to <a href="{{ page.redirect_to | relative_url }}">Xufang Pang's homepage</a>.</p>
  <script>window.location.replace({{ page.redirect_to | relative_url | jsonify }} + window.location.search + window.location.hash);</script>
</body>
</html>
