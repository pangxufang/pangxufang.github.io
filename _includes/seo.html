{% assign canonical_path = page.canonical_path | default: page.url | replace: '/index.html', '/' %}
{% assign canonical_url = canonical_path | absolute_url %}
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ canonical_url }}">
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
{% if site.google_site_verification %}<meta name="google-site-verification" content="{{ site.google_site_verification | escape }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.seo_title %}{{ page.seo_title | escape }}{% else %}{{ page.title | escape }} · {{ site.title | escape }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:image" content="{{ site.data.profile_v2.portrait_url | absolute_url }}">
{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": {{ canonical_url | jsonify }},
  "name": {{ site.title | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "name": "Xufang Pang",
    "alternateName": ["庞旭芳", "Xufang PANG", "pangxufang"],
    "knowsAbout": ["Robotic 3D perception", "High-precision 3D sensing", "3D sensors", "Point cloud understanding", "Spatial intelligence", "Computer graphics", "Computer vision"],
    "url": {{ canonical_url | jsonify }},
    "image": {{ site.data.profile_v2.portrait_url | absolute_url | jsonify }},
    "jobTitle": "Associate Research Fellow",
    "affiliation": { "@type": "Organization", "name": "Shenzhen Institute of Artificial Intelligence and Robotics for Society (AIRS)" },
    "sameAs": ["https://scholar.google.com/citations?user=y8ZC-4MAAAAJ", "https://github.com/pangxufang"]
  }
}
</script>
{% endif %}
