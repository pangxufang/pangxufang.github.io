<div class="modal fade" id="citation-modal" tabindex="-1" role="dialog" aria-labelledby="citation-modal-title" aria-describedby="citation-paper-title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="citation-modal-title">Citation</h2>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <p id="citation-paper-title" class="font-weight-bold"></p>
        <label for="citation-format">Citation format</label>
        <select id="citation-format" class="custom-select mb-3">
          <option value="BibTeX">BibTeX</option>
          <option value="APA">APA</option>
          <option value="IEEE">IEEE</option>
        </select>
        <label for="citation-text" class="sr-only">Citation text</label>
        <textarea id="citation-text" class="form-control text-monospace" rows="10" readonly spellcheck="false"></textarea>
      </div>
      <div class="modal-footer">
        <span id="citation-copy-status" class="small mr-auto" role="status" aria-live="polite"></span>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="citation-copy">Copy citation</button>
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="publication-citations">{{ site.data.citations | jsonify }}</script>
